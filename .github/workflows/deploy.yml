name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Rebuild every 6 hours to refresh the starred repositories on /github.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_ACCESS_TOKEN: ${{ secrets.GH_STARS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # Installs the Node.js and pnpm versions pinned in mise.toml.
      - uses: jdx/mise-action@v5

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

      - name: Upload preview version
        if: github.event_name == 'pull_request'
        run: pnpm exec wrangler versions upload --preview-alias "pr-${{ github.event.number }}"

      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: pnpm exec wrangler deploy
